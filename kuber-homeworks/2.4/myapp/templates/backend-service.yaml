apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-backend
  labels:
    app: {{ include "myapp.name" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: {{ include "myapp.name" . }}-backend
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: 8080
