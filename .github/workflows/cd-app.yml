name: Build and Deploy Test App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'devops-diplom-yandexcloud/k8s/test-app/**'

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: crpudopro8jpj70h8dn0
  IMAGE_NAME: test-app

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize YC and Login to Registry
        run: |
          echo '${{ secrets.YC_SA_JSON }}' > /tmp/sa-key.json
          yc config profile create ci-cd
          yc config set service-account-key /tmp/sa-key.json
          IAM_TOKEN=$(yc iam create-token)
          echo $IAM_TOKEN | docker login --username iam --password-stdin cr.yandex

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./devops-diplom-yandexcloud/k8s/test-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG }}' > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update deployment image tag
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}|" devops-diplom-yandexcloud/k8s/test-app/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f devops-diplom-yandexcloud/k8s/test-app/deployment.yaml
          kubectl rollout status deployment/test-app -n default
