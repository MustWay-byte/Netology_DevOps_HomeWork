name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'devops-diplom-yandexcloud/infra/**'
      - 'devops-diplom-yandexcloud/bootstrap/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devops-diplom-yandexcloud/infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize YC CLI
        run: |
          # Создаем файл с ключом из GitHub Secret
          cat << 'SECRETEOF' > /tmp/sa-key.json
          ${{ secrets.YC_SA_JSON }}
          SECRETEOF
          
          # Проверяем, что JSON валиден
          jq empty /tmp/sa-key.json
          
          # Настраиваем yc CLI
          yc config profile create terraform-ci
          yc config set service-account-key /tmp/sa-key.json
          yc config set cloud-id $(jq -r '.cloud_id' /tmp/sa-key.json)
          yc config set folder-id $(jq -r '.folder_id' /tmp/sa-key.json)
          
          # ВАЖНО: Мы НЕ удаляем файл /tmp/sa-key.json, он нужен для Terraform!

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/sa-key.json
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/sa-key.json
        run: terraform plan -no-color

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/sa-key.json
        run: terraform apply -auto-approve -no-color
