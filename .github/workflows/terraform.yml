name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'devops-diplom-yandexcloud/infra/**'
      - 'devops-diplom-yandexcloud/bootstrap/**'
  workflow_dispatch:

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devops-diplom-yandexcloud/infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authorize YC CLI
        run: |
          echo '${{ secrets.YC_SA_JSON }}' > /tmp/sa-key.json
          yc config profile create terraform-ci
          yc config set service-account-key /tmp/sa-key.json
          yc config set cloud-id $(echo '${{ secrets.YC_SA_JSON }}' | jq -r '.cloud_id')
          yc config set folder-id $(echo '${{ secrets.YC_SA_JSON }}' | jq -r '.folder_id')
          rm /tmp/sa-key.json

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform plan -no-color

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve -no-color
