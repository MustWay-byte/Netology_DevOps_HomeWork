global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'security'
    static_configs:
      - targets: ['security:5000']
    metrics_path: '/metrics'

  - job_name: 'uploader'
    static_configs:
      - targets: ['uploader:5000']
    metrics_path: '/metrics'

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
